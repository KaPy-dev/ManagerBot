services:
  bot:
    build: .
    image: answer-bot:latest
    container_name: answer-bot
    restart: unless-stopped
    volumes:
      - ./storage:/app/storage:rw,z
      - ./loginning/log:/app/loginning/log:rw,z
    environment:
      - TZ=Europe/Moscow
    # Внешний HTTP API для заявок с сайта (API_SECRET/API_PORT в configuration/conf.env)
    ports:
      - "${API_PORT:-8090}:8090"
